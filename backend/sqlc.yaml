version: '2'
sql:
  - engine: postgresql
    queries: internal/modules/accounts/internal/queries
    schema: db/migrations
    gen:
      go:
        package: store
        out: internal/modules/accounts/internal/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
