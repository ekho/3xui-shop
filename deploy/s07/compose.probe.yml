# Optional infrastructure for the owned Docker acceptance stack only.
services:
  gateway:
    volumes:
      - ../s07/Caddyfile.fault:/etc/caddy/Caddyfile:ro
    environment:
      S07_FAULT_MODE: '${S07_FAULT_MODE:-off}'
      S07_FAULT_PATH: '${S07_FAULT_PATH:-/__s07_fault_disabled__}'
      S07_FAULT_METHOD: '${S07_FAULT_METHOD:-POST}'
  vpn-probe:
    extends:
      file: ../s01/compose.local.yml
      service: vpn-client
    ports: !override ['127.0.0.1:59449:1080']
    volumes: !override ['${S07_PROBE_CONFIG:?required}:/run/secrets/vpn_config.json:ro']
