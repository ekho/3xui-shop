# Credentials are retained when new sales are disabled.
x-payment: &payment
  environment:
    SHOP_PAYMENT_HELEKET_ENABLED: '${SHOP_PAYMENT_HELEKET_ENABLED:-false}'
    HELEKET_MERCHANT_ID: '${HELEKET_MERCHANT_ID:?required}'
    HELEKET_API_KEY_FILE: /run/secrets/heleket_api_key
  secrets: [heleket_api_key]
services:
  backend: *payment
  migrate: *payment
  reconcile: *payment
secrets:
  heleket_api_key: {file: '${HELEKET_API_KEY_FILE:?required}'}
