            "type": "string",
            "format": "uuid"
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{8}$"
          },
          "new_password": {
            "type": "string",
            "minLength": 15,
            "maxLength": 128
          }
        },
        "required": [
          "new_password"
        ],
        "oneOf": [
          {
            "required": [
              "token"
            ],
            "not": {
              "anyOf": [
                {
                  "required": [
                    "code"
                  ]
                },
                {
                  "required": [
                    "challenge_id"
                  ]
                }
              ]
            }
          },
          {
            "required": [
              "challenge_id",
              "code"
            ],
            "not": {
              "required": [
                "token"
              ]
            }
          }
        ]
      },
      "VerifyResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "verified": {
            "type": "boolean",
            "enum": [
