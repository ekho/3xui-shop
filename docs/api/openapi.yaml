      "RegistrationAccepted": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "challenge_id": {
            "type": "string",
            "format": "uuid"
          },
          "resend_after": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
